[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "snowgym-client"
version = "0.1.0"
description = "Gymnasium client for the SnowGym simulation server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium==1.3.0",
  "numpy>=2.0,<3",
  "pettingzoo>=1.25,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
snowgym-check = "snowgym_client.check:main"
snowgym-demo = "snowgym_client.demo:main"
snowgym-parallel-check = "snowgym_client.parallel_check:main"
snowgym-benchmark = "snowgym_client.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snowgym_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
