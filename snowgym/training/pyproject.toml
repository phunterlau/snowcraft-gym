[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "snowgym-training"
version = "0.1.0"
description = "Reproducible imitation and reinforcement learning tools for SnowGym"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "snowgym-client",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
learn = ["torch>=2.7,<3"]

[project.scripts]
snowgym-audit-dataset = "snowgym_training.trajectory:main"
snowgym-convert-plan-rollouts = "snowgym_training.plan_rollout:main"
snowgym-run-plan-ablation = "snowgym_training.plan_ablation:main"
snowgym-evaluate-plan-ablation = "snowgym_training.plan_evaluate:main"
snowgym-evaluate-plan-checkpoint = "snowgym_training.plan_checkpoint_evaluate:main"
snowgym-evaluate-plan-counterfactual = "snowgym_training.plan_counterfactual_evaluate:main"
snowgym-qualify-plan-counterfactual = "snowgym_training.plan_counterfactual_qualification:main"
snowgym-summarize-plan-weight-sweep = "snowgym_training.plan_weight_sweep:main"
snowgym-qualify-plan-action-adapter = "snowgym_training.plan_action_adapter_qualification:main"
snowgym-qualify-plan-ablation = "snowgym_training.plan_qualification:main"
snowgym-evaluate-plan-closed-loop = "snowgym_training.plan_closed_loop:main"
snowgym-export-trajectories = "snowgym_training.export_scripted:main"
snowgym-export-dagger = "snowgym_training.export_dagger:main"
snowgym-export-plan-dagger = "snowgym_training.export_plan_dagger:main"
snowgym-merge-trajectories = "snowgym_training.merge_trajectory:main"
snowgym-teacher-baseline = "snowgym_training.baseline:main"
snowgym-train-bc = "snowgym_training.trainer:main"
snowgym-evaluate-checkpoint = "snowgym_training.evaluate:main"
snowgym-benchmark-batch = "snowgym_training.benchmarks.throughput:main"
snowgym-demo-learned = "snowgym_training.demo:main"
snowgym-train-ppo = "snowgym_training.ppo_train:main"
snowgym-evaluate-ppo = "snowgym_training.ppo_evaluate:main"
snowgym-run-ppo-series = "snowgym_training.ppo_series:main"
snowgym-run-ppo-config = "snowgym_training.ppo_series_config:main"
snowgym-audit-ppo-series = "snowgym_training.ppo_series:audit_main"
snowgym-demo-ppo = "snowgym_training.ppo_demo:main"
snowgym-train-option-ppo = "snowgym_training.options.train:main"
snowgym-option-causal-fork = "snowgym_training.options.causal_fork:main"
snowgym-qualify-m7b = "snowgym_training.options.qualification:main"
snowgym-evaluate-m7b = "snowgym_training.options.evaluate:main"
snowgym-engage-interventions = "snowgym_training.options.interventions:main"
snowgym-export-engage-diagnostics = "snowgym_training.options.diagnostics:main"
snowgym-engage-gradient-diagnostics = "snowgym_training.options.gradient_diagnostics:main"
snowgym-summarize-engage-recovery = "snowgym_training.options.recovery_report:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snowgym_training"]

[tool.hatch.build.targets.wheel.force-include]
"baselines/teacher_1v1_v0.json" = "snowgym_training/baselines/teacher_1v1_v0.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
snowgym-client = { path = "../python", editable = true }
